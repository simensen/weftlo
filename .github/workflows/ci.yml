name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.12 is built with go1.26; the older v2.5 pin panics with
          # "file requires newer Go version go1.26 (application built
          # with go1.25)" once setup-go's `stable` channel resolves to
          # go1.26 (its analyzer binary was compiled against go1.25).
          version: v2.12

      - name: Run tests
        run: go test -v ./...
